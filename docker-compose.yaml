version: "3"

services:
  todosDB:
    image: postgres:15.3 # Version de la base de datos
    container_name: sabg-buap # nombre del contenedor, dns hacia la base de datos
    restart: always # Reinicio para levantar la base de datos
    ports:
      #
      - 5432:5432 # Burbuja totalmente aislada. 
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=admin
    volumes:
      - ./postgres:/var/lib/postgresql/data
